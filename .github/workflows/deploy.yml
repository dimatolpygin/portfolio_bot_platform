name: deploy

on:
  push:
    branches:
      - main
      - dev
  repository_dispatch:
    types:
      - bot_updated
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write

concurrency:
  group: bots-platform-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── Тесты: запускаются для всех веток ────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Run tests
        run: go test ./...

  # ── Синхронизация бота из внешнего репо (только repository_dispatch) ─────
  sync-bot:
    needs: [test]
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    outputs:
      build_sha: ${{ steps.sync.outputs.build_sha }}
    steps:
      - name: Checkout platform repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install validation tooling
        run: python -m pip install --upgrade pip pyyaml jsonschema

      - name: Resolve catalog entry
        id: catalog
        env:
          BOT_SLUG: ${{ github.event.client_payload.bot_slug }}
          BOT_REPO: ${{ github.event.client_payload.repo }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import yaml

          slug = os.environ["BOT_SLUG"]
          repo = os.environ["BOT_REPO"]
          catalog = yaml.safe_load(pathlib.Path("config/bots.yml").read_text(encoding="utf-8"))

          for bot in catalog.get("bots", []):
              if bot.get("slug") != slug:
                  continue
              if bot.get("repo") != repo:
                  raise SystemExit(f"catalog repo mismatch for {slug}: expected {bot.get('repo')}, got {repo}")
              snapshot_path = bot.get("snapshot_path", ".") or "."
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write(f"snapshot_path={snapshot_path}\n")
              break
          else:
              raise SystemExit(f"bot slug {slug} is not registered in config/bots.yml")
          PY

      - name: Checkout bot repo at pinned SHA
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ github.event.client_payload.sha }}
          path: .dispatch-bot
          token: ${{ secrets.BOT_REPO_READ_TOKEN }}
          fetch-depth: 1

      - name: Validate dispatched bot manifest
        env:
          SNAPSHOT_PATH: ${{ steps.catalog.outputs.snapshot_path }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import yaml
          from jsonschema import Draft202012Validator

          manifest_path = pathlib.Path(".dispatch-bot") / os.environ["SNAPSHOT_PATH"] / "bot.yaml"
          schema_path = pathlib.Path("registry/schemas/bot.schema.json")

          manifest = yaml.safe_load(manifest_path.read_text(encoding="utf-8"))
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          errors = sorted(Draft202012Validator(schema).iter_errors(manifest), key=lambda error: list(error.path))
          if errors:
              for error in errors:
                  location = ".".join(str(item) for item in error.path) or "<root>"
                  print(f"{location}: {error.message}")
              raise SystemExit("bot.yaml schema validation failed")
          PY

      - name: Sync bot snapshot and lock
        id: sync
        env:
          BOT_SLUG: ${{ github.event.client_payload.bot_slug }}
          BOT_REPO: ${{ github.event.client_payload.repo }}
          BOT_REF: ${{ github.event.client_payload.ref }}
          BOT_SHA: ${{ github.event.client_payload.sha }}
          SNAPSHOT_PATH: ${{ steps.catalog.outputs.snapshot_path }}
        run: |
          go run ./cmd/botsctl sync-bot \
            -slug "${BOT_SLUG}" \
            -repo "${BOT_REPO}" \
            -ref "${BOT_REF}" \
            -sha "${BOT_SHA}" \
            -source ".dispatch-bot/${SNAPSHOT_PATH}" \
            -snapshot-path "${SNAPSHOT_PATH}"

          if git diff --quiet -- "registry/bots/${BOT_SLUG}" registry/bots.lock.json; then
            echo "build_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "registry/bots/${BOT_SLUG}" registry/bots.lock.json
          git commit -m "chore(registry): sync ${BOT_SLUG} to ${BOT_SHA}"
          git push
          echo "build_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  # ── Сборка и пуш Docker-образа (только main / dispatch / manual) ─────────
  build-and-push:
    needs:
      - test
      - sync-bot
    if: |
      always() &&
      needs.test.result == 'success' &&
      (needs.sync-bot.result == 'success' || needs.sync-bot.result == 'skipped') &&
      (github.ref == 'refs/heads/main' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Resolve build metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ -n "${{ needs.sync-bot.outputs.build_sha }}" ]; then
            BUILD_SHA="${{ needs.sync-bot.outputs.build_sha }}"
          else
            BUILD_SHA="${GITHUB_SHA}"
          fi
          echo "build_sha=${BUILD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${BUILD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Checkout build ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.build_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bots-platform:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/bots-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Деплой на VPS + регистрация вебхуков ─────────────────────────────────
  deploy:
    needs:
      - sync-bot
      - build-and-push
    if: ${{ always() && needs.build-and-push.result == 'success' && (needs.sync-bot.result == 'success' || needs.sync-bot.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy backend container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"
            git pull --ff-only
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            export GHCR_IMAGE="ghcr.io/${{ github.repository_owner }}/bots-platform"
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            docker compose pull
            docker compose up -d
            docker image prune -f

      - name: Register Telegram webhooks
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            bash "${{ secrets.VPS_APP_DIR }}/scripts/set-webhooks.sh" "${{ secrets.VPS_APP_DIR }}"
