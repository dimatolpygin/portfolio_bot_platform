name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bot repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install validation tooling
        run: python -m pip install --upgrade pip pyyaml jsonschema

      - name: Validate bot.yaml
        run: python tests/validate_manifest.py bot.yaml schemas/bot.schema.json

      - name: Run smoke tests
        run: |
          chmod +x tests/smoke.sh
          tests/smoke.sh

      - name: Extract bot slug
        id: manifest
        run: |
          python - <<'PY'
          import os
          import pathlib
          import yaml

          manifest = yaml.safe_load(pathlib.Path("bot.yaml").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"bot_slug={manifest['slug']}\n")
          PY

      - name: Trigger platform repository_dispatch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOTS_PLATFORM_DISPATCH_TOKEN }}
          script: |
            await github.request("POST /repos/{owner}/{repo}/dispatches", {
              owner: process.env.BOTS_PLATFORM_OWNER,
              repo: process.env.BOTS_PLATFORM_REPO,
              event_type: "bot_updated",
              client_payload: {
                bot_slug: process.env.BOT_SLUG,
                repo: process.env.BOT_REPO,
                ref: context.ref.replace("refs/heads/", ""),
                sha: context.sha
              }
            })
        env:
          BOTS_PLATFORM_OWNER: ${{ secrets.BOTS_PLATFORM_OWNER }}
          BOTS_PLATFORM_REPO: ${{ secrets.BOTS_PLATFORM_REPO }}
          BOT_REPO: ${{ github.repository }}
          BOT_SLUG: ${{ steps.manifest.outputs.bot_slug }}

