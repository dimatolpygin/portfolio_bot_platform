services:
  backend:
    image: ${GHCR_IMAGE:-ghcr.io/dimatolpygin/bots-platform}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bots-platform
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8080}:8080"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: bots-redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

volumes:
  redis_data:

